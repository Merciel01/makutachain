name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.lock.txt
      - name: Vérifier Python et Web Crypto
        run: python -m pytest -q
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check web/app.js
          node --check web/interface.mjs
          node --check web/wallet.mjs
      - name: Exécuter la démonstration isolée
        run: PYTHONPATH=. python scripts/demo.py
