[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mithimbochain"
version = "0.1.0"
description = "Blockchain pédagogique locale et monnaie native MTC"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<49", "Flask>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["mithimbochain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
